name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.1.3

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the release tag
        run: >-
          node -e 'const version = require("./apps/desktop/package.json").version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Stable releases require an x.y.z version, received ${version}`);
          }
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match ${expected}`);
          }'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Apple release credentials
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: >-
          node -e 'const required = ["APPLE_APP_SPECIFIC_PASSWORD", "APPLE_ID",
          "APPLE_TEAM_ID", "CSC_KEY_PASSWORD", "CSC_LINK"];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length > 0) {
            throw new Error(`Missing release secrets: ${missing.join(", ")}`);
          }'

      - name: Verify source
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check

      - name: Build and stage the web application
        run: pnpm --filter @trueedge/desktop run build:web

      - name: Build, sign, and notarize macOS artifacts
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: >-
          pnpm --filter @trueedge/desktop exec electron-builder
          --mac dmg zip --arm64 --x64 --publish never

      - name: Verify signatures, notarization, and update metadata
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          designated_requirement=""
          for app_bundle in "release/mac/TrueEdge.app" "release/mac-arm64/TrueEdge.app"; do
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            spctl --assess --type execute --verbose=4 "$app_bundle"
            xcrun stapler validate "$app_bundle"
            signing_details=$(codesign -dv --verbose=4 "$app_bundle" 2>&1)
            grep -Fq "TeamIdentifier=${APPLE_TEAM_ID}" <<<"$signing_details"
            grep -Eq '^Authority=Developer ID Application:' <<<"$signing_details"
            current_requirement=$(codesign -d -r- "$app_bundle" 2>&1 | sed -n 's/^designated => //p')
            test -n "$current_requirement"
            if [[ -z "$designated_requirement" ]]; then
              designated_requirement="$current_requirement"
            else
              test "$current_requirement" = "$designated_requirement"
            fi
          done
          RELEASE_VERSION="$version" ruby <<'RUBY'
          require "base64"
          require "digest"
          require "yaml"

          version = ENV.fetch("RELEASE_VERSION")
          names = [
            "TrueEdge-#{version}-mac-arm64.dmg",
            "TrueEdge-#{version}-mac-arm64.zip",
            "TrueEdge-#{version}-mac-x64.dmg",
            "TrueEdge-#{version}-mac-x64.zip"
          ]
          expected_publish_files = (names + names.map { |name| "#{name}.blockmap" } + ["latest-mac.yml"]).sort
          actual_publish_files = Dir.glob("release/*").select do |path|
            File.file?(path) && (path.end_with?(".dmg", ".zip", ".blockmap") || File.basename(path) == "latest-mac.yml")
          end.map { |path| File.basename(path) }.sort
          raise "Unexpected release artifact set: #{actual_publish_files.inspect}" unless actual_publish_files == expected_publish_files

          metadata = YAML.safe_load(File.read("release/latest-mac.yml"), aliases: false)
          raise "Update metadata version does not match #{version}" unless metadata["version"] == version
          files = metadata.fetch("files")
          entries = files.to_h { |entry| [entry.fetch("url"), entry] }
          raise "Update metadata has duplicate artifact URLs" unless entries.length == files.length
          raise "Update metadata artifact set is invalid" unless entries.keys.sort == names.sort

          names.each do |name|
            path = File.join("release", name)
            entry = entries.fetch(name)
            expected_digest = Base64.strict_encode64(Digest::SHA512.file(path).digest)
            raise "Incorrect size for #{name}" unless entry["size"] == File.size(path)
            raise "Incorrect SHA-512 for #{name}" unless entry["sha512"] == expected_digest
          end

          primary = metadata.fetch("path")
          raise "Primary update path must be the x64 ZIP" unless primary == "TrueEdge-#{version}-mac-x64.zip"
          raise "Primary update digest is invalid" unless metadata["sha512"] == entries.fetch(primary)["sha512"]
          RUBY

      - name: Store verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos-release-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-macos-release-${{ github.sha }}
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local object_json object_sha object_type
            object_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
            object_sha=$(jq -r .object.sha <<<"$object_json")
            object_type=$(jq -r .object.type <<<"$object_json")
            while [[ "$object_type" = "tag" ]]; do
              object_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_sha=$(jq -r .object.sha <<<"$object_json")
              object_type=$(jq -r .object.type <<<"$object_json")
            done
            test "$object_type" = "commit"
            printf '%s' "$object_sha"
          }

          test "$(resolve_tag_commit)" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; remove the stale draft before retrying." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "TrueEdge ${GITHUB_REF_NAME#v}" \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" \
            release/*.dmg \
            release/*.zip \
            release/*.blockmap \
            release/latest-mac.yml

          version=${GITHUB_REF_NAME#v}
          expected_assets=$(printf '%s\n' \
            "TrueEdge-${version}-mac-arm64.dmg" \
            "TrueEdge-${version}-mac-arm64.dmg.blockmap" \
            "TrueEdge-${version}-mac-arm64.zip" \
            "TrueEdge-${version}-mac-arm64.zip.blockmap" \
            "TrueEdge-${version}-mac-x64.dmg" \
            "TrueEdge-${version}-mac-x64.dmg.blockmap" \
            "TrueEdge-${version}-mac-x64.zip" \
            "TrueEdge-${version}-mac-x64.zip.blockmap" \
            "latest-mac.yml" | sort)
          actual_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          test "$(resolve_tag_commit)" = "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" --draft=false
