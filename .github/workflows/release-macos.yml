name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.1.3

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the release tag
        run: >-
          node -e 'const version = require("./apps/desktop/package.json").version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Stable releases require an x.y.z version, received ${version}`);
          }
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match ${expected}`);
          }'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check

      - name: Build and stage the web application
        run: pnpm --filter @trueedge/desktop run build:web

      - name: Build ad-hoc signed macOS DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          pnpm --filter @trueedge/desktop exec electron-builder
          --mac dmg --arm64 --x64 --publish never

      - name: Verify installers and architectures
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          expected_dmgs=$(printf '%s\n' \
            "TrueEdge-${version}-mac-arm64.dmg" \
            "TrueEdge-${version}-mac-x64.dmg" | sort)
          actual_dmgs=$(find release -maxdepth 1 -type f -name '*.dmg' -exec basename {} \; | sort)
          test "$actual_dmgs" = "$expected_dmgs"

          for dmg in \
            "release/TrueEdge-${version}-mac-arm64.dmg" \
            "release/TrueEdge-${version}-mac-x64.dmg"; do
            hdiutil verify "$dmg"
          done

          verify_dmg_payload() (
            set -euo pipefail
            dmg=$1
            expected_arch=$2
            mount_point=$(mktemp -d)
            cleanup() {
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
              rmdir "$mount_point" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
            app_bundle="$mount_point/TrueEdge.app"
            plist="$app_bundle/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version"
            test "$(lipo -archs "$app_bundle/Contents/MacOS/TrueEdge")" = "$expected_arch"
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            signing_details=$(codesign -dv --verbose=4 "$app_bundle" 2>&1)
            grep -Fq 'Signature=adhoc' <<<"$signing_details"
            grep -Fq 'TeamIdentifier=not set' <<<"$signing_details"
            ! grep -Eq '^Authority=' <<<"$signing_details"
          )

          verify_dmg_payload "release/TrueEdge-${version}-mac-arm64.dmg" "arm64"
          verify_dmg_payload "release/TrueEdge-${version}-mac-x64.dmg" "x86_64"

      - name: Store verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adhoc-macos-dmgs-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified DMGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adhoc-macos-dmgs-${{ github.sha }}
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local object_json object_sha object_type
            object_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
            object_sha=$(jq -r .object.sha <<<"$object_json")
            object_type=$(jq -r .object.type <<<"$object_json")
            while [[ "$object_type" = "tag" ]]; do
              object_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_sha=$(jq -r .object.sha <<<"$object_json")
              object_type=$(jq -r .object.type <<<"$object_json")
            done
            test "$object_type" = "commit"
            printf '%s' "$object_sha"
          }

          test "$(resolve_tag_commit)" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; remove the stale draft before retrying." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --notes "Ad-hoc signed macOS installers; no Apple Developer account is required. On first launch, try opening TrueEdge once, then use System Settings > Privacy & Security > Open Anyway because the app is not notarized." \
            --title "TrueEdge ${GITHUB_REF_NAME#v}" \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" release/*.dmg

          version=${GITHUB_REF_NAME#v}
          expected_assets=$(printf '%s\n' \
            "TrueEdge-${version}-mac-arm64.dmg" \
            "TrueEdge-${version}-mac-x64.dmg" | sort)
          actual_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          test "$(resolve_tag_commit)" = "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" --draft=false
